name: build-windows

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag da Release que recebe os instaladores (ex.: v0.1.0). Vazio = só artifact."
        required: false
        default: ""
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - run: npm ci

      # Em push de tag v*, cria (ou reaproveita) a Release da tag e anexa .msi e .exe.
      # Em execução manual, usa a tag informada; vazia = só compila e gera artifact.
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || inputs.tag }}
          releaseName: Organizador de Escalas ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || inputs.tag }}
          releaseBody: Instalador Windows (.msi e .exe).
          releaseDraft: false
          prerelease: false
          args: --bundles msi,nsis

      - uses: actions/upload-artifact@v4
        with:
          name: organizador-escalas-windows
          path: |
            target/release/bundle/msi/*.msi
            target/release/bundle/nsis/*.exe
          if-no-files-found: error
