[workspace]
resolver = "2"
members = [
    "crates/escala-core",
    "crates/escala-excel",
    "crates/escala-db",
    "crates/escala-app",
    "src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.90"
license = "MIT"

[workspace.dependencies]
chrono = { version = "0.4.42", default-features = false, features = ["std", "clock", "serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
calamine = "0.37"
rust_xlsxwriter = "0.101"
rusqlite = { version = "0.40", features = ["bundled"] }
escala-core = { path = "crates/escala-core" }
escala-excel = { path = "crates/escala-excel" }
escala-db = { path = "crates/escala-db" }
escala-app = { path = "crates/escala-app" }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
